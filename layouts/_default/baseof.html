<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
    <meta name="description" content="{{ with .Params.summary }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }} RSS" href="{{ "/index.xml" | relURL }}">
    <style>
      body { font-family: system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; line-height: 1.7; color: #111; }
      nav { display: flex; flex-wrap: wrap; gap: 0.9rem; }
      nav a { margin-right: 0; }
      .meta { color: #666; font-size: 0.95rem; }
      main section { margin: 2rem 0; }
      ul { padding-left: 1.2rem; }
      li { margin: 0.8rem 0; }
      footer { margin-top: 3rem; color: #666; font-size: 0.9rem; }
      code, pre { font-family: ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <header>
      <h1><a href="{{ "/" | relURL }}" style="color: inherit; text-decoration: none;">{{ .Site.Title }}</a></h1>
      <p>{{ .Site.Params.description }}</p>
      <nav>
        <a href="{{ "/" | relURL }}">Home</a>
        <a href="{{ "/notes/" | relURL }}">Notes</a>
        <a href="{{ "/essays/" | relURL }}">Essays</a>
        <a href="{{ "/index.xml" | relURL }}">RSS</a>
        <a href="{{ "/notes/index.xml" | relURL }}">Notes RSS</a>
        <a href="{{ "/essays/index.xml" | relURL }}">Essays RSS</a>
      </nav>
      <hr>
    </header>
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    <footer>
      <hr>
      <p>Published from markdown.</p>
    </footer>
  </body>
</html>
